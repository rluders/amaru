openapi: 3.1.0
info:
  title: Amaru Public API
  version: 0.1.0
  description: >-
    Commands and queries over HTTP; events over WebSocket (`/v1/projects/{projectId}/events`, frames in `../schemas/events/`).
    Major version `v1` is in the URL path; `info.version` is the contract package version (0.x until the Local MVP,
    CONTRACT_VERSIONING section 4). Additive changes only within v1; clients ignore unknown fields and unknown event
    types. Shapes are JSON Schema 2020-12 files under `../schemas/`. Status: PROPOSED, nothing is served yet; the
    Platform (M3) must register exactly these routes (route-drift guard).
servers:
- url: http://127.0.0.1:{port}/v1
  variables:
    port:
      default: '0'
      description: Dynamic; published by the local Platform
security:
- bearer: []
- browserSession: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness + versions. Unauthenticated, Host-checked health probe.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/Health.json
  /auth/launch-codes:
    post:
      operationId: createLaunchCode
      summary: Native CLI/Desktop only; issue a single-use 256-bit code, valid for 60 seconds.
      description: Empty body. Administrator bearer only, no Cookie or Origin. All auth responses use no-store and no-referrer.
      security:
      - bearer: []
      responses:
        '201':
          description: Launch code; never log or persist it.
          content:
            application/json:
              schema:
                $ref: ../schemas/LaunchCode.json
        default:
          $ref: '#/components/responses/Error'
  /auth/launch:
    servers:
    - url: /
    get:
      operationId: exchangeLaunchCode
      summary: Exchange one launch code for an eight-hour absolute browser session.
      description: Exact bound Host required. Consume once, set host-only HttpOnly SameSite=Strict Path=/ cookie and redirect to /. No redirect parameter. Secure where permitted on loopback. No-store and no-referrer, including errors.
      security: []
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        '303':
          description: Code-free root; session credential only in Set-Cookie.
          headers:
            Location:
              schema:
                type: string
                const: /
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /auth/session:
    get:
      operationId: getSession
      summary: Read CSRF token and absolute expiry of an existing browser session; never renew.
      description: Cookie only. No-store and no-referrer. No foreign-Origin response or wildcard CORS.
      security:
      - browserSession: []
      responses:
        '200':
          description: Session metadata; contains no session credential.
          content:
            application/json:
              schema:
                $ref: ../schemas/BrowserSession.json
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSession
      summary: Revoke only this browser session and expire its cookie.
      description: Cookie plus exact allowed Origin and matching X-Amaru-CSRF required. No-store and no-referrer.
      security:
      - browserSession: []
        csrf: []
      responses:
        '204':
          description: Session revoked; expired Set-Cookie.
        default:
          $ref: '#/components/responses/Error'
  /projects:
    get:
      operationId: listProjects
      summary: Projects attached to this Platform.
      description: >-
        Requires the current human Instance administrator. Inspects one captured active clone per Project using
        bounded read-only Git. Returns all attached Projects ordered by stored name then id, or no results.
        409 conflict when a known Project has an unavailable/mismatched clone or invalid config; other store/process
        failures are 500 internal. Errors are redacted. Reads never change clone selection.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/ProjectList.json
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: attachProject
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      summary: Attach a usable Git Project root (idempotent).
      description: >-
        Requires the current human Instance administrator. 400 invalid_request for an invalid body, non-absolute,
        missing or unusable root/repository/config; 409 conflict if another identity owns the root; other store/process
        failures are 500 internal. Errors are redacted. Inspection uses bounded read-only Git without network or hooks.
        Reattach preserves stored metadata/settings/history and selects this canonical clone. A committed attach
        remains committed if authorization is lost before the response; retry explicitly selects that clone again.
        Optional branch, remote and repositories fields are omitted. No execution authority is granted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/AttachProject.json
      responses:
        '200':
          description: The attached Project with preserved stored metadata and captured clone inspection.
          content:
            application/json:
              schema:
                $ref: ../schemas/Project.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      description: >-
        Requires the current human Instance administrator. Returns stored metadata and one captured active clone
        inspected through bounded read-only Git, without network or hooks. Unknown or malformed Project ids are
        404 not_found; known unavailable/mismatched clones or invalid config are 409 conflict; other store/process
        failures are 500 internal. Errors are redacted; no other root is substituted. config.present refers to a regular
        committed .amaru/config.yaml blob at inspected HEAD; dirty working-tree edits are ignored. Successful
        inspection has git.present true. Optional branch, remote and repositories fields are omitted.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/Project.json
        default:
          $ref: '#/components/responses/Error'
  /providers:
    get:
      operationId: listProviders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/ProviderList.json
        default:
          $ref: '#/components/responses/Error'
  /capabilities:
    get:
      operationId: listCapabilities
      description: >-
        Capabilities usable in workflow tool/system steps - the built-in vendor-neutral catalog plus every capability
        a provider offers, each with its canonical spec (inputs, output roles) and the providers offering it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/CapabilityList.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/executions:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listExecutions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/ExecutionList.json
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createExecution
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      description: |
        Resolves `capability` (and optional `providerId`) to a provider and starts the execution.
        `idempotencyKey` is required and makes retries safe under ADR-0058. `input` is `{prompt}` for agent.run or `{artifactId}` for asset.generate. Optional `workItemId` links the execution to a Work Item (not_found if unknown). Errors: invalid_request, provider_unavailable (no provider / not available), conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/CreateExecution.json
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ../schemas/Execution.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/executions/{id}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getExecution
      parameters:
      - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/Execution.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/executions/{id}/cancel:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: cancelExecution
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      description: >-
        Requires `idempotencyKey`. A retry of the same key and normalized request returns the original command
        result, even after the Execution ends. A new cancellation of a terminal Execution is `conflict`.
        Conflicting key reuse is `conflict`; command records have no automatic expiry in M3 (ADR-0058).
      parameters:
      - $ref: '#/components/parameters/ExecutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/CancelExecution.json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/Execution.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/executions/{id}/events:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listExecutionEvents
      description: >-
        Persisted events of one Execution, oldest first, up to `limit` (default 1000, max 5000) after the cursor
        `after` (a `seq`). Unlike the live stream this survives Platform restarts and buffer eviction. Page with
        `nextCursor`.
      parameters:
      - $ref: '#/components/parameters/ExecutionId'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 5000
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/events/EventList.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/events:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: events
      description: >-
        WebSocket upgrade, one stream per Project. The first frame is `Hello`, then `Event` frames with strictly
        increasing `seq` (the per-Project cursor; every event carries `id`, `projectId`, `resource` and optional
        `correlationId`). `since=<seq>` replays retained events with seq > since. When the cursor cannot be served
        the server sends one `ResyncRequired` frame and the client reloads state through the HTTP queries, then
        resumes from `resumeFrom`. Native clients use an Authorization bearer header without Origin or Cookie.
        Browsers use the same-origin session cookie and an allowed Origin. Query token parameters are rejected.
        Sessions close their established sockets on expiry or logout.
      parameters:
      - name: since
        in: query
        schema:
          type: integer
          minimum: 0
      - name: executionId
        in: query
        schema:
          type: string
      responses:
        '101':
          description: Switching Protocols
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/work-packages:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listWorkPackages
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/WorkPackageList.json
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createWorkPackage
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      description: The Platform assigns the id (a ULID). New packages start as `planned`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/CreateWorkPackage.json
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ../schemas/WorkPackage.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/work-packages/{id}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getWorkPackage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/WorkPackage.json
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateWorkPackage
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/UpdateWorkPackage.json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/WorkPackage.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/work-items:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listWorkItems
      parameters:
      - name: packageId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/WorkItemList.json
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createWorkItem
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      description: >-
        The Platform assigns the id (a ULID) and the display key (`<PROJECTKEY>-<n>`, unique per Instance). Errors - invalid_request, not_found (unknown
        package).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/CreateWorkItem.json
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ../schemas/WorkItem.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/work-items/{id}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getWorkItem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/WorkItem.json
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateWorkItem
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      description: >-
        Status is set by the user and never derived from executions. `blockedReason` is only kept while status is
        `blocked`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/UpdateWorkItem.json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/WorkItem.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/workflows:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listWorkflows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/WorkflowList.json
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createWorkflow
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      description: The Platform assigns the id (WF-001, …). Persisted under `.Amaru/workflows/`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/CreateWorkflow.json
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ../schemas/Workflow.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/workflows/{id}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getWorkflow
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/Workflow.json
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateWorkflow
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/UpdateWorkflow.json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/Workflow.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/workflows/{id}/source:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getWorkflowSource
      description: The workflow file exactly as stored (`.Amaru/workflows/<id>.yaml`). Read-only preview.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/workflows/{id}/run:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: runWorkflow
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      description: >-
        Starts one Execution through the normal execution path, carrying a Step Execution per workflow step (`steps`).
        Executable steps run sequentially, one provider run each; the first failure stops later steps. Trigger steps
        are skipped and tool/system steps without an available capability provider are unsupported - never reported
        as successful. The Execution carries `workflowId`. `workItemId` is linked only when given, never inferred.
        Errors - not_found (workflow or work item), conflict (workflow not active, or a step's Agent is disabled),
        invalid_request (no executable steps, or a step's Agent does not exist), provider_unavailable. A step with
        an `agentId` runs on its Agent's resolved provider and records an Agent snapshot on its Step Execution;
        the run-level `providerId` applies only to agent steps without an `agentId`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../schemas/RunWorkflow.json
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ../schemas/Execution.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/agents:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listAgents
      description: The project's Agent catalog, ordered by id.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/AgentList.json
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createAgent
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      description: >-
        Persisted at `.Amaru/agents/<id>.json`. Errors - invalid_request, conflict (id already exists). Retire an
        Agent in use with status `disabled`; an Agent no Workflow refers to can be deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/CreateAgent.json
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ../schemas/Agent.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/agents/{id}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getAgent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/Agent.json
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateAgent
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      description: >-
        The body names the `expectedRevision` the caller read. Errors - not_found, invalid_request, conflict (the Agent
        is at another revision, or is deleted).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/UpdateAgent.json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/Agent.json
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAgent
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      description: >-
        Removes `.Amaru/agents/<id>.json`; recorded revisions are kept. Errors - not_found, conflict (a Workflow step
        still refers to the Agent - disable it instead - or `expectedRevision` is stale).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: expectedRevision
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '204':
          description: Deleted
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/teams:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listTeams
      description: The project's Teams, ordered by id.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/TeamList.json
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createTeam
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      description: Persisted at `.Amaru/teams/<id>.json`. Errors - invalid_request, conflict (id exists).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/CreateTeam.json
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ../schemas/Team.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/teams/{id}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getTeam
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/Team.json
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateTeam
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/UpdateTeam.json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/Team.json
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteTeam
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      description: Errors - not_found, conflict (a workflow step still uses the team).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/settings:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getSettings
      description: The project's Platform-owned discovery preferences (ADR-0064); all off by default.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/ProjectSettings.json
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateSettings
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/UpdateSettings.json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/ProjectSettings.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/artifacts:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listArtifacts
      description: Markdown notes with a `type` frontmatter key, scanned read-only from the project. Filters combine
        with AND.
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: workItemId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/ArtifactList.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/artifacts/{id}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getArtifact
      description: The id is the project-relative note path (slashes are not escaped), e.g. `/artifacts/Assets/Player.md`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/Artifact.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/work-packages/{id}/delivery-loop:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - name: id
      in: path
      required: true
      schema:
        $ref: ../schemas/WorkPackageId.json
    get:
      operationId: getDeliveryLoop
      description: >-
        The delivery loop ledger of a Work Package: per-Work-Item phase, attempts, runs, pull request and decisions.
        Platform state; Work Items and Executions stay authoritative. Replaces the prototype route `/work-packages/{id}/delivery
        loop`, which was registered by the server but missing from the contract. 404 `not_found` for an unknown
        package or one without a delivery loop.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/DeliveryLoopLedger.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/approvals:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listApprovals
      description: >-
        Approvals of the Project, newest request first. Filter by `state` (default `requested`). Read-only; deciding
        stays on the decision route.
      parameters:
      - name: state
        in: query
        required: false
        schema:
          $ref: ../schemas/Approval.json#/properties/state
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/ApprovalList.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/approvals/{approvalId}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - name: approvalId
      in: path
      required: true
      schema:
        $ref: ../schemas/Ulid.json
    get:
      operationId: getApproval
      description: One Approval with the Evidence it binds.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/Approval.json
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/approvals/{approvalId}/decision:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - name: approvalId
      in: path
      required: true
      schema:
        $ref: ../schemas/Ulid.json
    post:
      operationId: decideApproval
      security:
      - bearer: []
      - browserSession: []
        csrf: []
      description: >-
        A human principal approves or rejects a `requested` Approval. `idempotencyKey` is required; identical retries
        return the original decision and conflicting reuse is `conflict` (ADR-0058, no automatic expiry in M3). Only humans may decide (ADR-0036); the decider is the
        authenticated principal, never a body field. Errors: `not_found`; `forbidden` when the role, Team or separation-of-duties
        rule is not met (recorded as an Event, the Approval is unchanged); `conflict` when the Approval is not `requested`
        or `evidenceDigest` differs from its current digest. Use-time reuse and re-request rules are decided by ADR-0048 (accepted 2026-10-26).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/DecideApproval.json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../schemas/Approval.json
        default:
          $ref: '#/components/responses/Error'
components:
  schemas:
    LaunchCode:
      $ref: ../schemas/LaunchCode.json
    BrowserSession:
      $ref: ../schemas/BrowserSession.json
    # Not returned by an HTTP operation: the frames of the WebSocket on `events`. Declared here so that generated
    # clients get the frame types from the contract instead of hand-writing them.
    StreamFrame:
      $ref: ../schemas/events/Frame.json
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: amaru_session
    csrf:
      type: apiKey
      in: header
      name: X-Amaru-CSRF
    bearer:
      type: http
      scheme: bearer
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
      description: Id returned by POST /projects.
    ExecutionId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: >-
        Error. Status mapping: invalid_request 400, unauthorized 401, forbidden_origin 403, forbidden 403, not_found
        404, conflict 409, rate_limited 429, needs_grant 403 (the action needs a Grant), provider_unavailable 422,
        protocol_mismatch 426, internal 500.
      content:
        application/json:
          schema:
            $ref: ../schemas/Error.json
x-api-major: 1
x-protocol:
  version: 1
  headers:
    X-Amaru-Protocol: Set on every response; integer major version.
  origin-policy: >-
    Exact bound loopback Host and port on every request. Native bearer clients must send no Cookie or Origin.
    Browser cookies require an allowed Origin for non-GET requests and WebSocket upgrades; non-GET also requires
    X-Amaru-CSRF. Mixed credentials and query tokens are rejected. No wildcard CORS. Only health and the launch
    exchange are unauthenticated. Browser session reads reject foreign Origin. Cookie sessions expire after eight
    hours without renewal; restart rotates credentials. See ADR-0034 and ADR-0061.
